name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      # Playwright starts its own preview server through webServer.
      - run: npx playwright test --project=webkit
      - name: Build for Pages
        run: npm run build && test -f dist/sw.js && test $(du -sk dist | cut -f1) -lt 2048 && test -f dist/manifest.webmanifest
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check CSP names the Supabase origin
        run: grep -q "connect-src 'self' ${VITE_SUPABASE_URL%/}" <(python3 -c "import html,sys;print(html.unescape(open('dist/index.html').read()))")
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
