# Orchestrator config for gym-plan. The rls and e2e-live levels need Docker Desktop running.

[skills]
plan = "plan-feature"
exec = "execute"

[validation]
levels = [
  { name = "typecheck", cmd = "npm run typecheck", expect = "exit 0" },
  { name = "lint", cmd = "npm run lint", expect = "exit 0" },
  { name = "unit", cmd = "npm test", expect = "exit 0; test count > 0" },
  { name = "build", cmd = "npm run build && test -f dist/sw.js && test -f dist/manifest.webmanifest", expect = "exit 0; sw.js and manifest exist" },
  { name = "e2e", cmd = "npx playwright test --project=webkit", expect = "exit 0" },
  { name = "precache-size", cmd = "test $(du -sk dist | cut -f1) -lt 2048", expect = "dist under 2048 KB" },
  { name = "no-personal-data", cmd = "test $(git ls-files | grep -cE '\\.jsonl$|exports/') -eq 0", expect = "0 tracked personal-data files" },
  { name = "no-secrets", cmd = "test $(git grep --untracked -lE 'sb_secret_[A-Za-z0-9]|SUPABASE_SERVICE_ROL[E]|GOCSP[X]-' | wc -l) -eq 0", expect = "0 files" },
  { name = "no-env-file", cmd = "test $(git ls-files | grep -cE '(^|/)\\.env$') -eq 0", expect = "0 tracked .env files" },
  { name = "rls", cmd = "npx supabase start && npx supabase db reset && npx supabase test db", expect = "exit 0; all pgTAP assertions pass" },
  { name = "e2e-live", cmd = "npx supabase start && npx supabase db reset && npx playwright test --project=webkit-live", expect = "exit 0" },
]

[surface]
paths = [{ name = "dependency manifest", globs = ["package.json", "package-lock.json"] }, { name = "data schema", globs = ["src/data/**"] }, { name = "ci", globs = [".github/**"] }]

[app]
start       = "npm run build && npx vite preview --port 4173 --strictPort"
url         = "http://localhost:4173/gym-plan/"
ready_probe = "text:gym-plan"
timeout_s   = 180

[e2e]
profile        = ".claude/e2e/profile.md"
session_prefix = "gym-plan-e2e"

[worker]
allow = [
  "npm install", "npm ci", "npm run", "npm test", "npx playwright", "npx vite", "npx tsc", "npx vitest",
  "Bash(npx supabase start)", "Bash(npx supabase stop)",
  "Bash(npx supabase status)", "Bash(npx supabase status -o env)",
  "Bash(npx supabase db reset)", "Bash(npx supabase test db)",
  "Bash(npx supabase gen types typescript --local)",
  "Bash(npx supabase gen types typescript --local --schema public)",
  "Bash(node scripts/live-server.mjs)", "Bash(node scripts/make-icons.mjs)",
  "Bash(node scripts/gen-gym.mjs)", "Bash(node scripts/check-gym-privacy.mjs)"
]

[figma]
checks     = "per-phase"
enabled    = true
file_key   = "YSNUOtf7qxvINzYofFDdDp"
bundle_dir = ".agents/figma"
token_env  = "FIGMA_TOKEN"

