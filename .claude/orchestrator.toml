# Orchestrator config for gym-plan. Levels mirror PRD 1 §14; the npm scripts they call are
# created by P1 (PRD §14 "config gap"), so every level except no-personal-data is red until P1 lands.

[skills]
plan = "plan-feature"
exec = "execute"

[validation]
levels = [
  { name = "typecheck", cmd = "npm run typecheck", expect = "exit 0" },
  { name = "lint", cmd = "npm run lint", expect = "exit 0" },
  { name = "unit", cmd = "npm test", expect = "exit 0; test count > 0" },
  { name = "build", cmd = "npm run build && test -f dist/sw.js && test -f dist/manifest.webmanifest", expect = "exit 0; sw.js and manifest exist" },
  { name = "e2e", cmd = "npx playwright test --project=webkit", expect = "exit 0" },
  { name = "precache-size", cmd = "test $(du -sk dist | cut -f1) -lt 2048", expect = "dist under 2048 KB" },
  { name = "no-personal-data", cmd = "test $(git ls-files | grep -cE '\\.jsonl$|exports/') -eq 0", expect = "0 tracked personal-data files" },
]

[surface]
paths = [{ name = "dependency manifest", globs = ["package.json", "package-lock.json"] }, { name = "data schema", globs = ["src/data/**"] }, { name = "ci", globs = [".github/**"] }]

[app]
start       = "npm run build && npx vite preview --port 4173 --strictPort"
url         = "http://localhost:4173/gym-plan/"
ready_probe = "text:gym-plan"
timeout_s   = 180

[e2e]
profile        = ".claude/e2e/profile.md"
session_prefix = "gym-plan-e2e"

[worker]
allow = ["npm install", "npm ci", "npm run", "npm test", "npx playwright", "npx vite", "npx tsc", "npx vitest"]
